<?xml version="1.0" encoding="UTF-8"?>
<!-- ebaner - a Norwegian railway simulator.
     Copyright (C) 2026 Jan-Espen Oversand <sigsegv@radiotube.org>
     Licensed under version 3 of the GNU General Public License.

     The editor's icon: deliberately the same scene as ebaner.svg so the two read as a
     pair, with the signal swapped for a switch stand's target plate and the rail
     carrying the drag handles you actually author geometry with. Amber rather than
     green, so the two are told apart at a glance and not only by shape. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d3350"/>
      <stop offset="1" stop-color="#3f6286"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#f2f6fa"/>
      <stop offset="1" stop-color="#9fb2c4"/>
    </linearGradient>
    <clipPath id="frame">
      <rect x="4" y="4" width="120" height="120" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect x="4" y="4" width="120" height="120" fill="url(#sky)"/>

    <path d="M -4 80 L 30 38 L 52 62 L 78 28 L 132 80 Z" fill="#22384f"/>
    <path d="M 78 28 L 90 40 L 83 43 L 75 38 L 70 42 Z" fill="#dfe9f2"/>
    <path d="M 30 38 L 38 47 L 33 49 L 27 46 L 23 49 Z" fill="#dfe9f2"/>

    <path d="M 16 124 L 112 124 L 76 62 L 52 62 Z" fill="#3a4a59"/>

    <path d="M 24 122 h 80 l -3 -6 h -74 Z" fill="#5d6e7d"/>
    <path d="M 34 106 h 60 l -3 -5 h -54 Z" fill="#5d6e7d"/>
    <path d="M 43 92 h 42 l -2 -4 h -38 Z" fill="#5d6e7d"/>
    <path d="M 50 80 h 28 l -2 -3 h -24 Z" fill="#5d6e7d"/>

    <path d="M 35 124 L 46 124 L 61 62 L 57 62 Z" fill="url(#rail)"/>
    <path d="M 82 124 L 93 124 L 71 62 L 67 62 Z" fill="url(#rail)"/>

    <!-- the switch stand, its target plate turned to face us -->
    <rect x="99" y="74" width="8" height="46" fill="#17212b"/>
    <circle cx="103" cy="68" r="14" fill="#f0a830"/>
    <circle cx="103" cy="68" r="5" fill="#17212b"/>

    <!-- geometry handles on the near rail, which is the editing itself -->
    <rect x="34" y="110" width="14" height="14" rx="2" fill="#f0a830" stroke="#17212b"
          stroke-width="2.5"/>
    <rect x="42" y="84" width="13" height="13" rx="2" fill="#f0a830" stroke="#17212b"
          stroke-width="2.5"/>
    <rect x="49" y="62" width="12" height="12" rx="2" fill="#f0a830" stroke="#17212b"
          stroke-width="2.5"/>
  </g>
</svg>
